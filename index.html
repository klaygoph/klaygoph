<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D1F3C">
<meta name="description" content="Klaygo PH — instant cleaning estimates, coverage areas, and online booking.">
<meta property="og:title" content="Klaygo PH">
<meta property="og:description" content="Instant cleaning estimates, coverage areas, and booking — all in one place.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://klaygoph.com/">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/klaygoph/klaygoph/main/assets/KlaygoPH%20-%20Rebranded%20-%20Favicon%20-%20Dark%20Square.png">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="canonical" href="https://klaygoph.com/pricing.html">
<meta http-equiv="refresh" content="0; url=/pricing.html">
<title>Klaygo PH | Pricing & Booking</title>

<!-- Self-hosted Manrope -->
<style>
@font-face{font-family:'Manrope';src:url('fonts/Manrope-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Manrope';src:url('fonts/Manrope-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
</style>
<!-- Self-hosted Argentum Novus -->
<style>
@font-face{font-family:'Argentum Novus';src:url('fonts/ArgentumNovus-Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap;}
</style>

<style>
:root{
  --mn:#0D1F3C;
  --li:#A8BFE0;
  --bg:#F7F9FC;
  --font-brand:'Argentum Novus','Outfit',sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-body);background:var(--mn);color:var(--bg);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--li);outline-offset:3px;border-radius:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:-9999px;top:0;padding:10px 18px;background:var(--bg);color:var(--mn);z-index:999;font-size:13px;border-radius:0 0 6px 0;}
.skip-link:focus{left:0;}

.topbar{padding:18px clamp(20px,4vw,48px);}
.brand{display:block;line-height:0;}
.brand img{height:32px;width:auto;}

main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px clamp(20px,5vw,64px);}
.box{max-width:420px;}
h1{font-family:var(--font-brand);font-weight:900;font-size:clamp(20px,2.6vw,26px);line-height:1.3;margin-bottom:12px;}
p{font-size:14px;color:rgba(247,249,252,.72);line-height:1.7;margin-bottom:22px;}
a.btn{display:inline-block;font-family:var(--font-brand);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mn);background:var(--li);border-radius:6px;padding:14px 30px;text-decoration:none;transition:background .15s;}
a.btn:hover{background:var(--bg);}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="topbar">
  <a href="/" class="brand" aria-label="Klaygo PH home">
    <img src="https://raw.githubusercontent.com/klaygoph/klaygoph/main/assets/KlaygoPH%20-%20Rebranded%20-%20Logo%20-%20Light%20-%20Res%20-%20100.png" alt="Klaygo PH">
  </a>
</header>

<main id="main-content">
  <div class="box">
    <h1>Taking you to our pricing &amp; booking page&hellip;</h1>
    <p>If you're not redirected automatically in a moment, tap below.</p>
    <a class="btn" href="/pricing.html">Go to Pricing</a>
  </div>
</main>

<script>
window.location.replace('/pricing.html');
</script>
</body>
</html>
